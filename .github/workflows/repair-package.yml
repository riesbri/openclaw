name: Pinned repair package

on:
  push:
    branches: [ops/package-repair-20261116]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      REPAIR_SOURCE_SHA: 4e6b996fbe872d651f4c671eb0c8fdf89240e59e
      GIT_COMMIT: 4e6b996fbe872d651f4c671eb0c8fdf89240e59e
      OPENCLAW_TSDOWN_MAX_OLD_SPACE_MB: "8192"
      RAYON_NUM_THREADS: "2"
      UV_THREADPOOL_SIZE: "2"
      GOMAXPROCS: "4"
      GOGC: "100"
      GOMEMLIMIT: 9GiB
    steps:
      - name: Checkout tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: riesbri/openclaw
          ref: 4e6b996fbe872d651f4c671eb0c8fdf89240e59e
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Inspect host and install pinned dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REPAIR_SOURCE_SHA"
          df -h .
          free -h
          nproc
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build canonical core package
        run: node --import ./scripts/tsx.mjs scripts/package-openclaw-for-docker.mts --output-dir "$RUNNER_TEMP/repair-package"
      - name: Build standalone repaired Codex package
        env:
          OPENCLAW_PLUGIN_NPM_PACK_OUTPUT_DIR: ${{ runner.temp }}/repair-package
        run: bash scripts/plugin-npm-publish.sh --pack extensions/codex
      - name: Record exact artifact identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REPAIR_SOURCE_SHA"
          git diff --exit-code
          cd "$RUNNER_TEMP/repair-package"
          sha256sum -- *.tgz > SHA256SUMS
          printf '%s\n' "$REPAIR_SOURCE_SHA" > source-sha.txt
      - name: Upload repair artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repaired-openclaw-20261116
          path: ${{ runner.temp }}/repair-package/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
